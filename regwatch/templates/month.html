{% extends "base.html" %}{% block title %}This month · RegWatch{% endblock %}
{% block body %}<h1>What to do this month</h1>{% for mv in moves %}{% include "partials/rule_move.html" %}{% endfor %}{% include "partials/month_list.html" %}
<script>
// Ticking a to-do re-renders #month-list; keep each regulation group open or closed as it was.
(function () {
  var state = {};
  document.body.addEventListener("htmx:beforeSwap", function () {
    document.querySelectorAll("#month-list details.reg").forEach(function (d) { state[d.id] = d.open; });
  });
  document.body.addEventListener("htmx:afterSwap", function () {
    document.querySelectorAll("#month-list details.reg").forEach(function (d) {
      if (d.id in state) d.open = state[d.id];
    });
  });
})();
</script>{% endblock %}
