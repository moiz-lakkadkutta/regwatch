# Nebius Serverless AI has no declarative YAML apply as of 2026-09; these are the values to enter in console (Serverless AI → Endpoints → Create/Update) or the flags for the CLI line at the bottom.
# Endpoint = the same image as the Job, `serve` mode: `regwatch seed && regwatch serve` on its own
# ephemeral SQLite, ONE uvicorn worker (the agent's executor and budget lock are per process).
# Keys: owner decision 2026-10-14 reverses the earlier no-keys rule so "Let the agent check" runs
# live; capped in code at $1 model + 60 Tavily credits per UTC day (REGWATCH_AGENT_DAILY_USD /
# _CREDITS defaults), 6 steps / 10 credits per run. Kill switch: REGWATCH_AGENT_ENABLED=false.
# The daily counter lives in the ephemeral /tmp DB below: a restart or redeploy starts the day again,
# so the real bound is the cap x boots that day. Use provider-side key caps where offered (runbook
# 12b) and redeploy sparingly on video day. Keys: the shared `regwatch-keys` secret (as the Job)
# until a separate Endpoint key pair exists; then put it in a second secret and change the name below.
# The shared demo profile is read-only (REGWATCH_PROFILE_LOCKED). Applied only at runbook step 12.
name: regwatch-web-5          # final URL, kept up through judging (Dec 1–15, 2026); 2026-10-14: no `endpoint update` in the CLI, so a redeploy is a new endpoint (new URL)
image: ghcr.io/moiz-lakkadkutta/regwatch:<GIT_SHA>   # deployed 2026-10-19: f01e14d (endpoint regwatch-web-5), built by .github/workflows/publish-image.yml; the Nebius registry (cr.eu-west2.nebius.cloud/e04t3ertpv4dynst9y) needs a local docker push
platform: cpu-d3
preset: 2vcpu-8gb           # smallest cpu-d3 preset in eu-west2
container_port: 8000
auth: none
public: true                # --public: tunnel URL + public IP; deployed URL https://port8000-fje4arxh07epk8b.tunnel.applications.eu-west2.nebius.cloud
disk_size: 32Gi             # default 250Gi costs ~$17.75/month
container_command: ""       # image ENTRYPOINT /app/entrypoint.sh; fallback if --args alone is refused
args: "serve"
env:
  PORT: "8000"
  REGWATCH_DB_URL: sqlite:////tmp/regwatch.db   # ephemeral; re-seeded on every boot
  REGWATCH_AGENT_ENABLED: "true"                # kill switch: "false" hides the button, agent routes 404
  REGWATCH_PROFILE_LOCKED: "true"               # POST /profile → 403 on the shared demo
  REGWATCH_AGENT_DAILY_CREDITS: "24"            # 2026-10-14: 451 Tavily credits left, ~60 kept for crawls, ÷ 16 days; pay-as-you-go since 10-15
  REGWATCH_REPORT_EMAIL: moizlakkadkutta1@gmail.com   # "Report a wrong call" recipient (owner decision 2026-10-19)
env_secret:                 # MysteryBox secret `regwatch-keys` (runbook step 4); used by the agent only
  NEBIUS_API_KEY: regwatch-keys
  TAVILY_API_KEY: regwatch-keys
# cli: nebius ai endpoint create --name regwatch-web-5 --image $IMAGE --platform cpu-d3 --preset 2vcpu-8gb --container-port 8000 --auth none --public --disk-size 32Gi --args serve --env PORT=8000 --env REGWATCH_DB_URL=sqlite:////tmp/regwatch.db --env REGWATCH_AGENT_ENABLED=true --env REGWATCH_PROFILE_LOCKED=true --env REGWATCH_AGENT_DAILY_CREDITS=24 --env REGWATCH_REPORT_EMAIL=moizlakkadkutta1@gmail.com --env-secret NEBIUS_API_KEY=regwatch-keys --env-secret TAVILY_API_KEY=regwatch-keys
