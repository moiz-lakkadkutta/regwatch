[project]
name = "regwatch"
version = "0.1.0"
description = "Tells small EU merchants which regulation changes apply to their store — Tavily + NVIDIA Nemotron on Nebius Token Factory."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Moiz Lakkadkutta" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlmodel>=0.0.22",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "openai>=1.50",
  "tavily-python>=0.5",
  "httpx>=0.27",
  "typer-slim>=0.12",
]

[project.scripts]
regwatch = "regwatch.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["regwatch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"regwatch/app.py" = ["B008"]
"regwatch/config.py" = ["E501"]
"regwatch/jobs/crawl.py" = ["E501"]
"regwatch/schemas.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real Nebius/Tavily APIs (manual only)"]
addopts = "-m 'not live'"
